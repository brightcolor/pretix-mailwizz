[build-system]
requires = ["setuptools", "pretix-plugin-build"]
build-backend = "setuptools.build_meta"

[project]
name = "pretix-mailwizz"
dynamic = ["version"]
description = "Optional newsletter opt-in checkbox in the pretix checkout that subscribes customers to a MailWizz list (double opt-in) after the order is placed."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "pretix-mailwizz contributors" }
]
keywords = ["pretix", "plugin", "mailwizz", "newsletter", "double opt-in", "email marketing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: Django",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.8",
  "ruff>=0.6",
]

[project.entry-points."pretix.plugin"]
pretix_mailwizz = "pretix_mailwizz:PluginApp"

[project.entry-points."distutils.commands"]
build = "pretix_plugin_build.build:CustomBuild"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "pretix_mailwizz.__version__" }

[tool.setuptools.packages.find]
include = ["pretix_mailwizz*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pretix.testutils.settings"
python_files = ["tests.py", "test_*.py"]
addopts = "-q -p no:cacheprovider"
testpaths = ["pretix_mailwizz/tests"]
norecursedirs = [".*", "build", "dist"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
